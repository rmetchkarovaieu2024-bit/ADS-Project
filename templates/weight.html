<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects - Smart Study Planner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .navbar {
            background: #000;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .subjects-container {
            padding: 40px;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background: #d9d9d9;
            padding: 30px;
            border-radius: 0 30px 30px 0;
            min-height: 600px;
        }
        .menu-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            color: #333;
        }
        .menu-item:hover {
            background: #c9c9c9;
        }
        .menu-item.active {
            background: #666;
            color: white;
        }
        .menu-icon {
            width: 24px;
            height: 24px;
            background: #888;
            border-radius: 4px;
        }
        .menu-item-no {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            color: #a3a3a3;
        }
        .subjects-content {
            flex: 1;
            padding: 40px;
        }
        .subjects-content h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .subject-item {
            background: #d9d9d9;
            padding: 20px 30px;
            border-radius: 50px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
        }
        .subject-name {
            font-weight: 600;
            flex: 1;
        }
        .weightage-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .weightage-selector label {
            font-size: 16px;
        }
        .weightage-selector select {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: white;
        }
        .save-button {
            background: #000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .save-button:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">✱ {{ user.username }}</div>
        <div class="nav-links">
            <a href="/leaderboard">Leaderboard</a>
            <a href="/schedule">Schedule</a>
            <a href="/study_log">Study Log</a>
            <a href="/dashboard">Dashboard</a>
        </div>
    </div>
    <div class="subjects-container">
        <div class="sidebar">
            <a href="/dashboard" class="menu-item"><div class="menu-icon"></div><span>Dashboard</span></a>
            <div class="menu-item active"><div class="menu-icon"></div><span>Subjects</span></div>
            <a href="/schedule" class="menu-item"><div class="menu-icon"></div><span>Schedule</span></a>
            <a href="/study_log" class="menu-item"><div class="menu-icon"></div><span>Study log</span></a>
            <div class="menu-item-no"><div class="menu-icon"></div><span>Study Groups</span></div>
            <a href="/leaderboard" class="menu-item"><div class="menu-icon"></div><span>Leaderboard</span></a>
            <div class="menu-item-no"><div class="menu-icon"></div><span>Milestones</span></div>
            <div class="menu-item-no"><div class="menu-icon"></div><span>Notifications</span></div>
        </div>
        <div class="subjects-content">
            <h1>Subjects</h1>
            {% for sw in subject_weights %}
                <div class="subject-item">
                  <span class="subject-name">{{ sw.subject }}</span>
                    <div class="weightage-selector">
                        <label for="weight-{{ loop.index }}">Weight:</label>
                        <select id="weight-{{ loop.index }}">
                          {% for i in range(1,7) %}
                            <option value="{{ i }}"
                              {% if sw.weight == i %}selected{% endif %}>
                              {{ i }}
                            </option>
                          {% endfor %}
                        </select>
                    </div>
                </div>
            {% endfor %}
            <button class="save-button" id="save-btn">Save Weight</button>
        </div>
    </div>
    <script>
        // Replace the script section in your weight.html with this:

        document.getElementById('save-btn').addEventListener('click', () => {
            const data = {};
            const weightCounts = {};
            let isValid = true;
            let errorMessage = '';

            // Collect all weights and count occurrences
            document.querySelectorAll('.subject-item').forEach((el, idx) => {
                const subj = el.querySelector('.subject-name').textContent.trim();
                const sel = el.querySelector('select');
                const weight = parseInt(sel.value, 10);

                data[subj] = weight;

                // Count how many times each weight is used
                if (weightCounts[weight]) {
                    weightCounts[weight]++;
                } else {
                    weightCounts[weight] = 1;
                }
            });

            // Check if any weight is used more than once
            const duplicateWeights = [];
            for (let weight in weightCounts) {
                if (weightCounts[weight] > 1) {
                    duplicateWeights.push(weight);
                }
            }

            if (duplicateWeights.length > 0) {
                errorMessage = 'Error: Weight(s) ' + duplicateWeights.join(', ') + ' assigned multiple times.\n\n';
                errorMessage += 'Each weight (1-6) must be assigned to exactly one subject.\n';
                errorMessage += 'Please assign unique weights and try again.';
                alert(errorMessage);
                return; // Stop execution, don't save
            }

            // Check if all weights 1-6 are used exactly once
            const usedWeights = Object.keys(weightCounts).map(w => parseInt(w)).sort();
            const expectedWeights = [1, 2, 3, 4, 5, 6];

            const missingWeights = expectedWeights.filter(w => !usedWeights.includes(w));

            if (missingWeights.length > 0) {
                errorMessage = 'Error: Weight(s) ' + missingWeights.join(', ') + ' not assigned.\n\n';
                errorMessage += 'Each weight from 1 to 6 must be assigned to exactly one subject.\n';
                errorMessage += 'Please assign all weights and try again.';
                alert(errorMessage);
                return; // Stop execution, don't save
            }

            console.log('Sending data:', data); // Debug: Check what's being sent

            // If validation passes, proceed with save
            fetch('/save_weights', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(r => {
                console.log('Response status:', r.status); // Debug
                if (!r.ok) {
                    throw new Error('HTTP error ' + r.status);
                }
                return r.json();
            })
            .then(res => {
                console.log('Response:', res); // Debug
                alert(res.message || res.error);
                if (res.message) {
                    location.reload(); // Reload page to show updated allocations
                }
            })
            .catch(err => {
                console.error('Save error:', err);
                alert('Save failed: ' + err.message);
            });
        });
    </script>
</body>
</html>
