<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .navbar {
            background: #000;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .welcome-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 60px);
            padding: 40px;
        }
        .welcome-content {
            display: flex;
            align-items: center;
            gap: 100px;
            max-width: 1200px;
        }
        .welcome-graphic {
            width: 400px;
            height: 400px;
            background: #000;
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
        }
        .welcome-text {
            flex: 1;
        }
        .welcome-text h1 {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .welcome-text p {
            font-size: 28px;
            margin-bottom: 60px;
        }
        .button {
            background: #000;
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            max-width: 500px;
            display: block;
            margin-bottom: 15px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #333;
        }
    </style>
    <script>
        function showScreen(screenId) {
            // Go to Flask routes: /register or /login
            if(screenId === 'registrationScreen') {
                window.location.href = '/register';
            } else if(screenId === 'leaderboardScreen') {
                window.location.href = '/login'; // or "/dashboard" if that's your login route
            }
        }
    </script>
</head>
<body>
    <div class="navbar">
        <div class="logo">✱</div>
    </div>
    <div class="welcome-container">
        <div class="welcome-content">
            <div class="welcome-graphic"></div>
            <div class="welcome-text">
                <h1>Smart Study</h1>
                <p>Create your personalized study schedule!</p>
                <button class="button" onclick="showScreen('registrationScreen')">Get Started</button>
                <button class="button" onclick="showScreen('leaderboardScreen')">Sign In</button>
            </div>
        </div>
    </div>
</body>
</html>
