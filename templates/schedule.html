<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - Smart Study Planner</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .navbar {
            background: #000;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            color: white;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .schedule-container {
            padding: 40px;
            display: flex;
        }
        .sidebar {
            width: 250px;
            background: #d9d9d9;
            padding: 30px;
            border-radius: 0 30px 30px 0;
            min-height: 600px;
        }
        .menu-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .menu-item:hover {
            background: #c9c9c9;
        }
        .menu-item.active {
            background: #666;
            color: white;
        }
        .menu-icon {
            width: 24px;
            height: 24px;
            background: #888;
            border-radius: 4px;
        }
        .schedule-content {
            flex: 1;
            padding: 40px;
        }
        .schedule-content h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 40px;
        }
        .availability-item {
            background: #d9d9d9;
            padding: 20px 30px;
            border-radius: 50px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 18px;
        }
        .day-name {
            font-weight: 600;
            flex: 1;
        }
        .time-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .time-selector label {
            font-size: 16px;
        }
        .time-selector input {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: white;
        }
        .no-avail {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .no-avail input {
            margin: 0;
        }
        .save-button {
            background: #000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        .save-button:hover {
            background: #333;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">✱</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/register">Register</a>
        </div>
    </div>
    <div class="schedule-container">
        <div class="sidebar">
            <a href="/dashboard" class="menu-item"><div class="menu-icon"></div><span>Dashboard</span></a>
            <a href="/weight" class="menu-item"><div class="menu-icon"></div><span>Subjects</span></a>
            <div class="menu-item active"><div class="menu-icon"></div><span>Schedule</span></div>
            <div class="menu-item"><div class="menu-icon"></div><span>Study Groups</span></div>
            <a href="/leaderboard" class="menu-item"><div class="menu-icon"></div><span>Leaderboard</span></a>
            <div class="menu-item"><div class="menu-icon"></div><span>Milestones</span></div>
            <div class="menu-item"><div class="menu-icon"></div><span>Notifications</span></div>
        </div>
        <div class="schedule-content">
            <h1>Set Your Availability</h1>
            <div class="availability-item">
                <span class="day-name">Monday</span>
                <div class="time-selector">
                    <label for="start-mon">Start:</label>
                    <input type="time" id="start-mon" value="09:00">
                    <label for="end-mon">End:</label>
                    <input type="time" id="end-mon" value="17:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-mon">
                    <label for="no-avail-mon">No Availability</label>
                </div>
            </div>
            <div class="availability-item">
                <span class="day-name">Tuesday</span>
                <div class="time-selector">
                    <label for="start-tue">Start:</label>
                    <input type="time" id="start-tue" value="09:00">
                    <label for="end-tue">End:</label>
                    <input type="time" id="end-tue" value="17:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-tue">
                    <label for="no-avail-tue">No Availability</label>
                </div>
            </div>
            <div class="availability-item">
                <span class="day-name">Wednesday</span>
                <div class="time-selector">
                    <label for="start-wed">Start:</label>
                    <input type="time" id="start-wed" value="09:00">
                    <label for="end-wed">End:</label>
                    <input type="time" id="end-wed" value="17:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-wed">
                    <label for="no-avail-wed">No Availability</label>
                </div>
            </div>
            <div class="availability-item">
                <span class="day-name">Thursday</span>
                <div class="time-selector">
                    <label for="start-thu">Start:</label>
                    <input type="time" id="start-thu" value="09:00">
                    <label for="end-thu">End:</label>
                    <input type="time" id="end-thu" value="17:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-thu">
                    <label for="no-avail-thu">No Availability</label>
                </div>
            </div>
            <div class="availability-item">
                <span class="day-name">Friday</span>
                <div class="time-selector">
                    <label for="start-fri">Start:</label>
                    <input type="time" id="start-fri" value="09:00">
                    <label for="end-fri">End:</label>
                    <input type="time" id="end-fri" value="17:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-fri">
                    <label for="no-avail-fri">No Availability</label>
                </div>
            </div>
            <div class="availability-item">
                <span class="day-name">Saturday</span>
                <div class="time-selector">
                    <label for="start-sat">Start:</label>
                    <input type="time" id="start-sat" value="10:00">
                    <label for="end-sat">End:</label>
                    <input type="time" id="end-sat" value="16:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-sat">
                    <label for="no-avail-sat">No Availability</label>
                </div>
            </div>
            <div class="availability-item">
                <span class="day-name">Sunday</span>
                <div class="time-selector">
                    <label for="start-sun">Start:</label>
                    <input type="time" id="start-sun" value="10:00">
                    <label for="end-sun">End:</label>
                    <input type="time" id="end-sun" value="16:00">
                </div>
                <div class="no-avail">
                    <input type="checkbox" id="no-avail-sun">
                    <label for="no-avail-sun">No Availability</label>
                </div>
            </div>
            <button class="save-button">Save Availability</button>
        </div>
    </div>
    <script>
        // Function to toggle time inputs based on checkbox
        function toggleAvailability(day) {
            const checkbox = document.getElementById(`no-avail-${day}`);
            const startInput = document.getElementById(`start-${day}`);
            const endInput = document.getElementById(`end-${day}`);
            if (checkbox.checked) {
                startInput.disabled = true;
                endInput.disabled = true;
                startInput.value = '';
                endInput.value = '';
            } else {
                startInput.disabled = false;
                endInput.disabled = false;
            }
        }

        // Add event listeners for each checkbox
        const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
        days.forEach(day => {
            document.getElementById(`no-avail-${day}`).addEventListener('change', () => toggleAvailability(day));
        });
    </script>
</body>
</html>
